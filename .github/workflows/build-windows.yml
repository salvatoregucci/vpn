name: Build Windows demo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "main.dart"
      - "demo_auth_gate.dart"
      - "split_tunnel_screen.dart"
      - "pubspec.yaml"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Move Dart sources into Flutter lib directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lib | Out-Null

          foreach ($file in @('main.dart', 'demo_auth_gate.dart', 'split_tunnel_screen.dart')) {
            $source = Join-Path (Get-Location) $file
            $destination = Join-Path (Join-Path (Get-Location) 'lib') $file

            if ((Test-Path $source) -and !(Test-Path $destination)) {
              Move-Item -Path $source -Destination $destination
            }
          }

          if (!(Test-Path 'lib/main.dart')) {
            throw 'lib/main.dart was not found. Check that main.dart exists in the repository root.'
          }

      - name: Generate Windows platform files if needed
        shell: pwsh
        run: |
          if (!(Test-Path 'windows')) {
            flutter create --platforms=windows --project-name spider_vpn .
          }

      - name: Install dependencies
        run: flutter pub get
        country_flags: ^3.2.0

      - name: Build Windows release
        run: flutter build windows --release

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpiderVPN-Windows-Demo
          path: build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
